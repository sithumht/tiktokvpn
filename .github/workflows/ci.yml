name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet and test the core
        run: |
          go build ./...
          go vet ./...
          go test ./...

  mobile-aar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager --channel=3 "platforms;android-26" "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Build the mobile library
        env:
          TIKTOKVPN_CORE_VERSION: ${{ github.sha }}
        run: ./scripts/build-mobile.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tiktokvpn-aar
          path: android/app/libs/tiktokvpn.aar

  android:
    needs: mobile-aar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tiktokvpn-aar
          path: android/app/libs
      - name: Install Android SDK packages
        run: sdkmanager --channel=3 "platforms;android-26" "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Unit tests, lint and debug APK
        env:
          TIKTOKVPN_VERSION_NAME: 1.0.0-ci
          TIKTOKVPN_VERSION_CODE: ${{ github.run_number }}
          TIKTOKVPN_CORE_VERSION: ${{ github.sha }}
        run: bash android/gradlew -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-apks
          path: android/app/build/outputs/apk/debug/*.apk
